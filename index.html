<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re×Tandil</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="icon" type="image/x-icon" href="static/faviconReportandil.png"
</head>

<body>
    <header>
    <img id="img-header" src="/static/faviconReportandil.png" alt="Logo de Reportandil" width="100">
    <h1>Reportandil</h1>
    </header>
    <p>Descripcion cool de la app</p>
    <form action="/opinion" method="POST">
        <fieldset>
            <label>Nombre:</label>
            <input type="text" name="name" required><br>
            <label>Te gusto la app?</label>
            <input type="radio" id="opcionSi" name="opinion" value="Si" checked>
            <label for="opcionSi">Si</label>
            <input type="radio" id="opcionNo" name="opinion" value="No">
            <label for="opcionNo">No</label>
            <button type="submit">Enviar</button>
        </fieldset>
    </form>
</body>
</html>
